<h1 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white">
  Auction Files
</h1>

<button (click)="goBackToAuctionList()" class="btn-primary mb-10">
  Back to Auctions
</button>
<br />
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
  @if (auctionData.length > 0) { 
  @for (auctionFile of auctionData; track $index)
  {
  <div
    class="bg-white dark:bg-gray-700 rounded-2xl shadow-lg p-2 flex flex-col items-center text-center space-y-2"
  >
    <div
      class="bg-gray-100 dark:bg-gray-800 p-8 rounded-xl shadow-md w-20 h-20 flex items-center justify-center"
    >
      @if ((auctionFile.contentType).startsWith("application")) {
      <lucide-angular
        [img]="fileText"
        class="w-12 h-12 text-gray-500 dark:text-gray-400"
      ></lucide-angular>
      } @else if((auctionFile.contentType).startsWith("image")) {
      <lucide-angular
        [img]="image"
        class="w-12 h-12 text-gray-500 dark:text-gray-400"
      ></lucide-angular>
      }
    </div>

    <div>
      <p class="text-lg font-semibold text-gray-800 dark:text-white truncate">
        {{ auctionFile.name }}
      </p>
    </div>

    <div class="flex space-x-3">
      <button (click)="viewFile(auctionFile.name)" class="btn-primary">
        View
      </button>

      <button (click)="getfileAttachment(auctionFile)" class="btn-secondary">
        Download
        <lucide-angular
          [img]="download"
          class="my-icon ml-1 text-white"
        ></lucide-angular>
      </button>
    </div>
  </div>
  } }
</div>
