<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 h-40">
  {{ title }}
  <div class="flex justify-between">
    <h1 class="font-bold text-3xl mt-7">{{ value }}</h1>
    <div [ngClass]="bgColor + ' p-4 rounded-2xl'">
      <img
        [ngSrc]="imgSrc"
        [height]="imgSize"
        [width]="imgSize"
        [alt]="imgAlt"
        priority
      />
    </div>
  </div>
</div>
