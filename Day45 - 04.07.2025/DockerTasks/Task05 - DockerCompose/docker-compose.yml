version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-db-data:/data/db
    networks:
      - app-network
  backend:
    build: ./backend
    container_name: node-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/db
    depends_on:
      - mongo
    networks:
      - app-network

    
volumes:
  mongo-db-data:

networks:
  app-network: