version: "3.8"

services:
  visualizer:
    image: dockersamples/visualizer:latest
    container_name: swarm-visualizer
    ports:
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOSTNAME=swarm-manager
    deploy:
      mode: replicated
      replicas: 4
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

