version: '3.8'

services:
  backend:
    build: ./Backend
    container_name: backend_node
    ports:
      - "5000:5000"
    networks:
      - app-network
  fronend:
    build: ./Frontend/my-app
    container_name: frontend_react
    ports:
    - "3000:80"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network: